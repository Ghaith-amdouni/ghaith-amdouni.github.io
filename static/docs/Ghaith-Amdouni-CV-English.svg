    <tspan x="28" dy="0">SecuriNets Technical Team Instructor and Networks and Telecommunications student at INSAT, passionate about</tspan>
    <tspan x="28" dy="10">cybersecurity, networking, DevOps, DevSecOps, and web development. Skilled, motivated, curious, and versatile, I am</tspan>
