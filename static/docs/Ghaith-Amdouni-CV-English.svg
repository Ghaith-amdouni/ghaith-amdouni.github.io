  </text>

  <text x="28" y="161" class="heading">PROFESSIONAL EXPERIENCE</text><path d="M28 166H567" class="rule"/>
  <text x="28" y="179" class="item">SecuriNets — Technical Team Instructor</text>
  <text x="520" y="179" class="date">Current</text>
  <text x="28" y="190" class="body">• Teach technical workshops and guide learners through practical cybersecurity and binary exploitation.</text>
  <text x="28" y="203" class="item">Digital Forensics Police Internship — FACEIS</text>
  <text x="458" y="203" class="date">1 — 31 August 2026</text>
  <text x="28" y="214" class="body">• Designed and built a facial investigation platform using RetinaFace, ArcFace, FAISS, FastAPI, and audited workflows.</text>
  <text x="28" y="227" class="item">Zedka Services — Web Development Intern / Contributor</text>
  <text x="420" y="227" class="date">June 2024 — August 2024</text>
  <text x="28" y="238" class="body">• Contributed across full-stack development, page optimization, content integration, configuration, and maintenance.</text>

  <text x="28" y="252" class="heading">PROJECTS</text><path d="M28 257H567" class="rule"/>
  <text x="28" y="270" class="item">MOJO-JOJO CTF — Challenge Author</text>
  <text x="28" y="281" class="body">• Designed advanced binary-exploitation challenges covering stack pivoting, heap overflows, SROP, and related techniques.</text>
  <text x="28" y="298" class="item">FST Bootcamp CTF Challenges — Binary Exploitation</text>
  <text x="28" y="309" class="body">• Created Dockerized ROP, ret2shellcode, and format-string challenges for the FST bootcamp.</text>
  <text x="28" y="326" class="item">TaskManager DevOps Pipeline</text>
  <text x="28" y="337" class="body">• Built a Spring Boot/PostgreSQL task manager, containerized with Docker, deployed on Kubernetes, integrated through</text>
  <text x="38" y="347" class="body">GitHub Actions, and monitored with Prometheus and Grafana.</text>
  <text x="28" y="364" class="item">Tor Network Simulation</text>
  <text x="28" y="375" class="body">• Modeled onion routing with multilayer encryption, relay nodes, and circuit-based TCP/IP traffic tunneling.</text>
  <text x="28" y="392" class="item">5G Mesh Network Simulation with OMNeT++</text>
  <text x="28" y="403" class="body">• Developed a simulation environment for studying the behavior of a 5G mesh network.</text>

